[project]
name = "podtool"
version = "0.1.0"
description = "Command line tool for working with an iPod's music database"
readme = "README.md"
authors = [
    { name = "Micaela Angeli", email = "1470630+mica-angeli@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "mutagen>=1.48.1",
    "pypodlib>=0.1.0",
]

[project.scripts]
podtool = "podtool:main"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"
